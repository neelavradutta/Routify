services:
  - type: web
    name: routify-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: routify-db
          property: connectionString
      - key: WEB_ORIGIN
        sync: false

databases:
  - name: routify-db
    plan: free
    databaseName: routify
    user: routify
